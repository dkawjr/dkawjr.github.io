                })
            });
            marker.bindPopup('<b>' + h.name + '</b><br>' + h.address + '<br>Type: ' + h.type);
            hospitalLayer.addLayer(marker);
            
            // Add 0.5 mile radius circle
            L.circle([h.lat, h.lon], {
                radius: 805, // 0.5 miles in meters
                color: '#0066cc',
                fillColor: '#0066cc',
                fillOpacity: 0.1,
                weight: 1.5,
                dashArray: '5, 5'
            }).addTo(hospitalLayer);
        });

        // Add all layers to map
        accessibleLayer.addTo(map);
        inaccessibleLayer.addTo(map);
        hospitalLayer.addTo(map);

        // Layer control
        var overlays = {
            "✅ Accessible Stations": accessibleLayer,
            "❌ Inaccessible Stations": inaccessibleLayer,
            "🏥 Major Hospitals": hospitalLayer
        };
        L.control.layers(null, overlays, {collapsed: false}).addTo(map);

        // Legend
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '<h4 style="margin:0 0 8px 0">Legend</h4>' +
                '<div class="legend-item"><div class="legend-dot" style="background:#2ca02c"></div>Accessible Station</div>' +
                '<div class="legend-item"><div class="legend-dot" style="background:#d62728"></div>Not Accessible</div>' +
                '<div class="legend-item"><div class="legend-hospital"></div>Hospital (0.5mi radius)</div>';
            return div;
        };
        legend.addTo(map);

        // Stats box
        var stats = L.control({position: 'topleft'});
        stats.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'stats-box');
            div.innerHTML = '<h3>System Statistics</h3>' +
                '<div class="stats-row"><span>Total Stations:</span><span><b>496</b></span></div>' +
                '<div class="stats-row"><span>Accessible:</span><span style="color:#2ca02c"><b>163 (32.9%)</b></span></div>' +
                '<div class="stats-row"><span>Not Accessible:</span><span style="color:#d62728"><b>333 (67.1%)</b></span></div>' +
                '<hr style="margin:8px 0">' +
                '<div class="stats-row"><span>Bronx Accessible:</span><span><b>20 of 70 (28.6%)</b></span></div>' +
                '<div class="stats-row"><span>Bronx Disability Rate:</span><span><b>14.8%</b></span></div>';
            return div;
        };
        stats.addTo(map);
    </script>
</body>
</html>
